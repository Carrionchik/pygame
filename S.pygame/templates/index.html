<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таблица лидеров - Bullet Hell</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #000;
            color: #fff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #ff0000;
            text-shadow: 0 0 10px #ff0000;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
            background: #111;
        }
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #333;
        }
        th {
            background: #222;
            color: #ff0000;
        }
        tr:hover {
            background: #1a1a1a;
        }
        .rank {
            font-weight: bold;
            color: #ffff00;
        }
        .empty {
            text-align: center;
            color: #666;
            padding: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏆 ТАБЛИЦА ЛИДЕРОВ 🏆</h1>
        
        {% if leaders %}
        <table>
            <thead>
                <tr>
                    <th>Место</th>
                    <th>Игрок</th>
                    <th>Макс. волна</th>
                    <th>Очки</th>
                    <th>Дата</th>
                </tr>
            </thead>
            <tbody>
                {% for leader in leaders %}
                <tr>
                    <td class="rank">#{{ loop.index }}</td>
                    <td>{{ leader.player_name }}</td>
                    <td>{{ leader.max_wave }}</td>
                    <td>{{ leader.score }}</td>
                    <td>{{ leader.created_at[:10] }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        {% else %}
        <div class="empty">
            <p>Пока нет результатов. Будь первым!</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
